# Input/output configuration
dataset_mode: quirk
input_dir: ${EXATRKX_DATA}/train_all
output_dir: Examples/TrackML_Quickstart/datasets/quickstart_quirk_example
detector_path: ${EXATRKX_DATA}/detectors.csv
n_files: 100
n_workers: 32
n_tasks: 1
overwrite: True
min_pt: 1

endcaps: True
noise: False
layerwise: True
modulewise: True
cell_information: False

# Quirk generation parameters
quirk_n_steps: 6000
quirk_t_max: 8.0
quirk_b_field: 2.0
quirk_charge: 1.0
quirk_mass: 1000.0
quirk_pair_pt: 2.0
quirk_pair_pz: 0.2
quirk_opening_angle: 1.57079632679
quirk_phi0: 0.0
quirk_x0: 0.0
quirk_y0: 0.0
quirk_z0: 0.0
quirk_string_tension: 0.02
quirk_oscillation_jitter: 0.0
quirk_velocity_scale: 2000.0
quirk_tolerance_mm: 260.0
quirk_max_hits: 96
quirk_sample_points: 600
quirk_pairs_per_event: 4
quirk_pair_pt_jitter_frac: 0.2
quirk_pair_phi_spread: 1.2
quirk_opening_angle_jitter: 0.35
quirk_origin_jitter_mm: 40.0
min_quirk_hits_per_track: 2
min_total_quirk_hits: 6
quirk_event_max_retries: 15

# SM background mixing
include_sm_background: True
sm_background_pt_min: 0.5
sm_background_max_hits: 3000
