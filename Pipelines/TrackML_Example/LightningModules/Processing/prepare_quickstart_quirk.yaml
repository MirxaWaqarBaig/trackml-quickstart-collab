# Input/output configuration
dataset_mode: quirk
input_dir: ${EXATRKX_DATA}/train_all
output_dir: Examples/TrackML_Quickstart/datasets/quickstart_quirk_example
detector_path: ""
n_files: 100
n_workers: 32
n_tasks: 1
overwrite: True
min_pt: 1

endcaps: True
noise: False
layerwise: True
modulewise: True
cell_information: False

# Quirk generation parameters
quirk_n_steps: 6000
quirk_t_max: 8.0
quirk_b_field: 2.0
quirk_charge: 1.0
quirk_pt: 2.0
quirk_pz: 0.2
quirk_phi0: 0.0
quirk_x0: 0.0
quirk_y0: 0.0
quirk_z0: 0.0
quirk_radial_amplitude: 0.0
quirk_radial_frequency: 3.0
quirk_radius_mm: 900.0
quirk_tolerance_mm: 120.0
quirk_max_hits: 64
quirk_sample_points: 600
